<!DOCTYPE html>
<html lang="en">
<head>
  <SCRIPT language="JavaScript"><!--hide //--></SCRIPT>
  <meta charset="utf-8" />
  <meta name="author" content="Anas Chawdhary" />
  <meta name="description" content="Password protect links using AES in the browser." />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <link rel="shortcut icon" type="image/x-icon" href="../favicon.ico">
  <title>Link Lock — Password-Protect Your Links</title>

  <script src="https://cdn.tailwindcss.com"><\/script>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <script>
    tailwind.config = {
      theme: { extend: {
        colors: {
          gold: { DEFAULT:'#ca8a04', light:'#eab308', dim:'#a16207', ghost:'rgba(202,138,4,0.08)' },
          ink:  { 900:'#111110', 800:'#181816', 700:'#1e1e1c', 600:'#252522', 500:'#2e2e2a', 400:'#3a3a35', 300:'#52524d', 200:'#a8a89e' }
        },
        fontFamily: { display:['Syne','sans-serif'], mono:['DM Mono','monospace'] }
      }}
    }
  <\/script>

  <style>
    *{box-sizing:border-box}
    body,input,textarea,button{font-family:'Syne',sans-serif}
    input[type=checkbox]{accent-color:#ca8a04;width:15px;height:15px;cursor:pointer;flex-shrink:0}
    input:focus,textarea:focus{outline:none}
    ::placeholder{color:#52524d}
    details>summary{list-style:none}
    details>summary::-webkit-details-marker{display:none}
  </style>

  <script type="text/javascript" src="../b64.js"><\/script>
  <script type="text/javascript" src="../api.js"><\/script>
  <script type="text/javascript">
    function error(t){document.querySelector(".err").style.display="flex";document.querySelector("#errortext").innerText=t}
    function main(){if(!("b64"in window)){error("Base64 library not loaded.");return}if(!("apiVersions"in window)){error("API library not loaded.");return}}
    function togglePass(id,btn){var i=document.getElementById(id),ic=btn.querySelector('i');if(i.type==='password'){i.type='text';ic.className='fa-regular fa-eye-slash'}else{i.type='password';ic.className='fa-regular fa-eye'}}
    function onCopy(id){var v=document.getElementById(id)&&document.getElementById(id).value;if(!v)return;navigator.clipboard?navigator.clipboard.writeText(v):(document.getElementById(id).select(),document.execCommand('copy'));var a=document.getElementById('ca');if(a){a.style.display='block';setTimeout(function(){a.style.display='none'},2200)}}
  <\/script>
  <script type="text/javascript" src="create.js"><\/script>
</head>

<body class="bg-ink-900 text-white min-h-screen" onload="main()">

  <noscript>
    <div class="max-w-lg mx-auto mt-8 p-5 border border-yellow-700 rounded-lg bg-yellow-950 text-yellow-200 text-sm">
      JavaScript is required. Please enable it or <a href="https://github.com/jstrieb/link-lock" class="underline">clone the source</a>.
    </div>
  </noscript>

  <!-- Error -->
  <div class="err max-w-lg mx-auto px-4 pt-5" style="display:none">
    <div class="flex items-center gap-3 bg-red-950 border border-red-800 border-l-4 border-l-red-500 rounded-md p-4 w-full">
      <i class="fa-solid fa-circle-exclamation text-red-400"></i>
      <p id="errortext" class="font-mono text-xs text-red-400 flex-1"></p>
      <button onclick="main()" class="text-red-400 border border-red-700 rounded px-3 py-1 text-xs font-semibold uppercase tracking-wide hover:bg-red-900 transition-colors">Retry</button>
    </div>
  </div>

  <div class="max-w-lg mx-auto px-4 pb-16">

    <!-- Header -->
    <div class="text-center pt-12 pb-10">
      <div class="w-14 h-14 mx-auto mb-5 rounded-full bg-ink-700 border border-gold flex items-center justify-center" style="box-shadow:0 0 28px rgba(202,138,4,.22)">
        <i class="fa-solid fa-lock text-gold-light text-xl"></i>
      </div>
      <div class="inline-flex items-center gap-2 mb-5 px-3 py-1 rounded-full bg-ink-700 border border-ink-500">
        <span class="w-1.5 h-1.5 rounded-full bg-gold-light"></span>
        <span class="font-mono text-gold text-xs tracking-widest uppercase">AES-256 Encrypted</span>
      </div>
      <h1 class="font-display text-4xl font-extrabold tracking-tight text-white mb-2">Link Lock</h1>
      <p class="font-display text-sm font-medium text-ink-200 tracking-wide">Password-protect any URL — encrypted entirely in your browser</p>
      <div class="flex items-center gap-3 mt-6 max-w-xs mx-auto">
        <div class="flex-1 h-px bg-ink-500"></div>
        <div class="flex gap-1.5 items-center">
          <span class="w-1 h-1 rotate-45 bg-gold-dim inline-block"></span>
          <span class="w-2 h-2 rotate-45 bg-gold inline-block"></span>
          <span class="w-1 h-1 rotate-45 bg-gold-dim inline-block"></span>
        </div>
        <div class="flex-1 h-px bg-ink-500"></div>
      </div>
    </div>

    <!-- Form Card -->
    <div class="bg-ink-800 border border-ink-500 rounded-xl overflow-hidden mb-4" style="box-shadow:0 8px 40px rgba(0,0,0,.6)">

      <!-- Card Header -->
      <div class="bg-ink-700 border-b border-ink-500 px-6 py-4 flex items-center gap-3">
        <div class="w-8 h-8 rounded-md bg-ink-600 border border-ink-400 flex items-center justify-center">
          <i class="fa-solid fa-key text-gold text-xs"></i>
        </div>
        <div>
          <p class="font-display font-bold text-sm text-white tracking-wide">Create Encrypted Link</p>
          <p class="font-mono text-xs text-ink-300 mt-0.5">Wrap any URL behind a password gate</p>
        </div>
      </div>

      <div class="p-6 flex flex-col gap-5">

        <!-- URL -->
        <div>
          <label class="font-mono text-xs uppercase tracking-widest text-gold flex items-center gap-2 mb-2">
            <i class="fa-solid fa-link text-xs"></i> Secret Link
          </label>
          <div class="relative">
            <i class="fa-solid fa-globe absolute left-3 top-1/2 -translate-y-1/2 text-ink-300 text-xs pointer-events-none"></i>
            <input type="url" id="url"
              class="w-full bg-ink-700 border border-ink-500 rounded-md text-white font-mono text-sm py-3 pr-3 pl-8 focus:border-gold transition-colors"
              style="caret-color:#ca8a04"
              placeholder="https://your-secret-url.com"
              oninvalid="if(!this.validity.customError)this.setCustomValidity('Please enter a valid URL including http:// or https://')"
              oninput="this.setCustomValidity('')" required />
          </div>
        </div>

        <!-- Hint -->
        <div>
          <label class="font-mono text-xs uppercase tracking-widest text-gold flex items-center gap-2 mb-2">
            <i class="fa-regular fa-comment-dots text-xs"></i> Hint
            <span class="normal-case tracking-normal text-ink-300 font-normal ml-1">— optional</span>
          </label>
          <textarea id="hint" rows="2"
            class="w-full bg-ink-700 border border-ink-500 rounded-md text-white font-mono text-sm p-3 resize-none focus:border-gold transition-colors"
            style="caret-color:#ca8a04"
            placeholder="A subtle clue for the recipient"></textarea>
        </div>

        <!-- Passwords -->
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="font-mono text-xs uppercase tracking-widest text-gold flex items-center gap-2 mb-2">
              <i class="fa-solid fa-key text-xs"></i> Password
            </label>
            <div class="relative">
              <input type="password" id="password"
                class="w-full bg-ink-700 border border-ink-500 rounded-md text-white font-mono text-sm py-3 pl-3 pr-9 focus:border-gold transition-colors"
                style="caret-color:#ca8a04" placeholder="Enter password" />
              <button type="button" onclick="togglePass('password',this)" tabindex="-1"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-ink-300 hover:text-gold transition-colors text-sm">
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
          </div>
          <div>
            <label class="font-mono text-xs uppercase tracking-widest text-gold flex items-center gap-2 mb-2">
              <i class="fa-solid fa-shield-halved text-xs"></i> Confirm
            </label>
            <div class="relative">
              <input type="password" id="confirm-password"
                class="w-full bg-ink-700 border border-ink-500 rounded-md text-white font-mono text-sm py-3 pl-3 pr-9 focus:border-gold transition-colors"
                style="caret-color:#ca8a04" placeholder="Repeat password" oninput="this.setCustomValidity('')" />
              <button type="button" onclick="togglePass('confirm-password',this)" tabindex="-1"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-ink-300 hover:text-gold transition-colors text-sm">
                <i class="fa-regular fa-eye"></i>
              </button>
            </div>
          </div>
        </div>

        <!-- Advanced -->
        <details class="border border-ink-500 rounded-md overflow-hidden">
          <summary class="flex items-center gap-2.5 px-4 py-3 cursor-pointer text-ink-300 hover:text-gold hover:bg-ink-700 transition-colors select-none">
            <i class="fa-solid fa-sliders text-xs"></i>
            <span class="font-mono text-xs uppercase tracking-widest">Advanced Options</span>
            <i class="fa-solid fa-chevron-down text-xs ml-auto transition-transform" id="adv-arrow"></i>
          </summary>
          <div id="advanced" class="bg-ink-700 border-t border-ink-500 px-4 py-4 flex flex-col gap-4">
            <label class="flex items-start gap-3 cursor-pointer group">
              <input type="checkbox" id="iv" onclick="onIvCheck(this)" checked class="mt-0.5" />
              <div>
                <p class="font-display font-semibold text-sm text-white group-hover:text-gold transition-colors">Random Initialization Vector</p>
                <p class="font-mono text-xs text-ink-300 mt-1">Generates a unique IV per encryption — strongly recommended</p>
              </div>
            </label>
            <label class="flex items-start gap-3 cursor-pointer group">
              <input type="checkbox" id="salt" class="mt-0.5" />
              <div>
                <p class="font-display font-semibold text-sm text-white group-hover:text-gold transition-colors">Random Salt</p>
                <p class="font-mono text-xs text-ink-300 mt-1">Adds entropy to key derivation, increasing brute-force resistance</p>
              </div>
            </label>
          </div>
        </details>

        <!-- Encrypt Button -->
        <button id="encrypt" onclick="onEncrypt()"
          class="w-full flex items-center justify-center gap-2.5 bg-gold hover:bg-gold-dim text-ink-900 font-display font-bold text-sm uppercase tracking-widest py-3.5 rounded-md transition-colors">
          <i class="fa-solid fa-lock"></i> Encrypt Link
        </button>

      </div>
    </div>

    <!-- Output Card -->
    <div class="bg-ink-800 border border-ink-500 rounded-xl overflow-hidden" style="box-shadow:0 8px 40px rgba(0,0,0,.6)">
      <div class="bg-ink-700 border-b border-ink-500 px-6 py-4 flex items-center gap-3">
        <div class="w-8 h-8 rounded-md bg-ink-600 border border-ink-400 flex items-center justify-center">
          <i class="fa-regular fa-clipboard text-gold text-xs"></i>
        </div>
        <div>
          <p class="font-display font-bold text-sm text-white tracking-wide">Encrypted Output</p>
          <p class="font-mono text-xs text-ink-300 mt-0.5">Your protected link — ready to share</p>
        </div>
      </div>
      <div class="p-6">
        <label class="font-mono text-xs uppercase tracking-widest text-gold flex items-center gap-2 mb-2">
          <i class="fa-solid fa-link text-xs"></i> Output
        </label>
        <div class="flex gap-3 mb-3">
          <input type="text" id="output" readonly placeholder="Encrypted link will appear here…"
            class="flex-1 bg-ink-700 border rounded-md font-mono text-sm py-3 px-3 text-gold focus:border-gold transition-colors"
            style="border-color:rgba(202,138,4,.3)" />
          <button id="copy" onclick="onCopy('output')"
            class="flex items-center gap-2 border border-gold text-gold hover:bg-gold hover:text-ink-900 font-display font-semibold text-xs uppercase tracking-widest px-4 py-3 rounded-md transition-colors flex-shrink-0">
            <i class="fa-regular fa-copy"></i> Copy
          </button>
        </div>
        <p id="ca" class="font-mono text-xs uppercase tracking-widest text-gold bg-ink-700 border border-ink-500 rounded py-2 text-center" style="display:none">
          <i class="fa-solid fa-circle-check mr-1.5"></i> Copied to clipboard
        </p>
      </div>
    </div>

    <!-- Footer -->
    <div class="text-center mt-12">
      <div class="flex items-center gap-4 mb-5">
        <div class="flex-1 h-px bg-ink-600"></div>
        <div class="flex gap-1.5 items-center">
          <span class="w-1 h-1 rotate-45 bg-ink-400 inline-block"></span>
          <span class="w-1.5 h-1.5 rotate-45 bg-ink-400 inline-block"></span>
          <span class="w-1 h-1 rotate-45 bg-ink-400 inline-block"></span>
        </div>
        <div class="flex-1 h-px bg-ink-600"></div>
      </div>
      <p class="font-display text-sm font-medium text-ink-300">Crafted by <span class="text-gold">Anas Chawdhary</span></p>
      <p class="font-mono text-xs text-ink-400 mt-1.5 tracking-widest uppercase">AES-GCM · PBKDF2 · Zero Server · Open Source</p>
    </div>

  </div>

  <script>
    document.querySelector('details').addEventListener('toggle',function(e){
      var a=document.getElementById('adv-arrow');
      if(a) a.style.transform=e.target.open?'rotate(180deg)':'';
    });
  <\/script>

</body>
</html>
