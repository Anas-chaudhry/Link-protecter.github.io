<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="author" content="Anas Chawdhary" />
  <meta name="description" content="Securely password protect your links with AES encryption." />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />

  <title>Link Lock | Secure Link Encryption</title>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #06b6d4;
      --accent-hover: #22d3ee;
      --text-main: #f8fafc;
      --text-dim: #94a3b8;
      --input-bg: #334155;
      --border-color: #475569;
      --error-red: #ef4444;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 500px;
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border-color);
    }

    /* Header Section */
    header {
      text-align: center;
      margin-bottom: 32px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin: 0;
      background: linear-gradient(to right, #06b6d4, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: var(--text-dim);
      font-size: 0.95rem;
      margin-top: 8px;
      font-weight: 400;
    }

    /* Form Styling */
    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
      color: var(--accent-color);
    }

    input[type="url"],
    input[type="password"],
    input[type="text"],
    textarea {
      width: 100%;
      padding: 12px 16px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      color: white;
      font-size: 1rem;
      box-sizing: border-box;
      transition: all 0.3s ease;
      outline: none;
    }

    input:focus, textarea:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.2);
    }

    .split-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    /* Custom Button */
    button {
      width: 100%;
      padding: 14px;
      background: var(--accent-color);
      color: var(--bg-color);
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, background 0.3s;
      margin-top: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    button:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
    }

    button:active {
      transform: translateY(0);
    }

    /* Advanced Section */
    details {
      margin: 20px 0;
      background: rgba(0,0,0,0.1);
      border-radius: 12px;
      padding: 10px;
    }

    summary {
      cursor: pointer;
      font-weight: 600;
      color: var(--text-dim);
      outline: none;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    summary::before {
      content: '⊕';
      color: var(--accent-color);
    }

    .advanced-content {
      padding-top: 15px;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      font-size: 0.9rem;
    }

    /* Output Area */
    .output-section {
      margin-top: 30px;
      padding-top: 25px;
      border-top: 1px dashed var(--border-color);
    }

    #copy {
      background: transparent;
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      margin-top: 15px;
    }

    #copy:hover {
      background: rgba(6, 182, 212, 0.1);
    }

    /* Error & Alert */
    .error {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid var(--error-red);
      color: var(--error-red);
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
      text-align: center;
    }

    .alert {
      display: none;
      color: #10b981;
      text-align: center;
      font-size: 0.9rem;
      margin-top: 10px;
      font-weight: 600;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      font-size: 0.8rem;
      color: var(--text-dim);
    }

    .copyright {
      font-weight: 600;
      color: var(--text-main);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-color); }
    ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
  </style>

  <script type="text/javascript" src="../b64.js"></script>
  <script type="text/javascript" src="../api.js"></script>
  <script type="text/javascript">
    function error(text) {
      const errBox = document.querySelector(".error");
      errBox.style.display = "block";
      document.querySelector("#errortext").innerText = `Error: ${text}`;
    }

    function main() {
      if (!("b64" in window)) {
        error("Base64 library not loaded.");
        return;
      }
      if (!("apiVersions" in window)) {
        error("API library not loaded.");
        return;
      }
    }
  </script>
  <script type="text/javascript" src="create.js"></script>
</head>

<body onload="main()">

  <div class="container">
    <header>
      <h1><i class="fa-solid fa-shield-halved"></i> LINK LOCK</h1>
      <p class="subtitle">Military-grade encryption for your private URLs</p>
    </header>

    <div class="error" style="display: none">
      <p id="errortext">Error occurred</p>
      <button onclick="location.reload()" style="padding: 5px; font-size: 0.8rem;">Retry</button>
    </div>

    <div class="form">
      <div class="form-group">
        <label for="url"><i class="fa-solid fa-link"></i> Secret Link</label>
        <input type="url" id="url" placeholder="https://your-secret-website.com" required />
      </div>

      <div class="form-group">
        <label for="hint"><i class="fa-solid fa-comment-dots"></i> Hint (Optional)</label>
        <textarea id="hint" rows="1" placeholder="e.g. My first pet's name"></textarea>
      </div>

      <div class="split-row">
        <div class="form-group">
          <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
          <input type="password" id="password" placeholder="••••••••" />
        </div>
        <div class="form-group">
          <label for="confirm-password"><i class="fa-solid fa-check-double"></i> Confirm</label>
          <input type="password" id="confirm-password" placeholder="••••••••" />
        </div>
      </div>

      <details>
        <summary>Security Settings</summary>
        <div class="advanced-content">
          <div class="checkbox-group">
            <input type="checkbox" id="iv" onclick="onIvCheck(this)" checked />
            <label for="iv" style="margin:0; font-size: 0.75rem;">Random Initialization Vector</label>
          </div>
          <div class="checkbox-group">
            <input type="checkbox" id="salt" checked />
            <label for="salt" style="margin:0; font-size: 0.75rem;">Random Salt</label>
          </div>
        </div>
      </details>

      <button id="encrypt" onclick="onEncrypt()">
        <i class="fa-solid fa-wand-magic-sparkles"></i> Encrypt Now
      </button>
    </div>

    <div class="output-section">
      <label for="output">Secure Output</label>
      <input type="text" id="output" readonly placeholder="Your locked link will appear here..." />
      <button id="copy" onclick="onCopy('output')">
        <i class="fa-solid fa-copy"></i> Copy to Clipboard
      </button>
      <p class="alert" id="copy-alert">Copied Successfully!</p>
    </div>

    <footer>
      <p>Created by <span class="copyright">Anas Chawdhary</span></p>
      <p style="margin-top: 5px; opacity: 0.5;">No data is ever stored on our servers.</p>
    </footer>
  </div>

  <noscript>
    <div style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; color: black; z-index: 9999; padding: 50px;">
      Enable JavaScript to use this premium tool.
    </div>
  </noscript>

</body>
</html>
