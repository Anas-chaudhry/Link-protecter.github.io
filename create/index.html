<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="author" content="Anas Chawdhary" />
  <meta name="description" content="Elite AES Link Protection" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />

  <title>LINK LOCK | ELITE ENCRYPTION</title>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Montserrat:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --gold-primary: #d4af37;
      --gold-bright: #f9e29b;
      --gold-dark: #aa841e;
      --bg-deep: #050505;
      --card-bg: #111111;
      --input-bg: #1a1a1a;
      --text-gold: #e2c275;
      --border-gold: rgba(212, 175, 55, 0.3);
    }

    body {
      background-color: var(--bg-deep);
      background-image: radial-gradient(circle at center, #1a1a1a 0%, #050505 100%);
      color: #ffffff;
      font-family: 'Montserrat', sans-serif;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Premium Card Container */
    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 550px;
      padding: 50px;
      border-radius: 2px; /* Sharp corners for premium look */
      border: 1px solid var(--border-gold);
      box-shadow: 0 0 40px rgba(0, 0, 0, 1), 0 0 15px rgba(212, 175, 55, 0.1);
      position: relative;
      overflow: hidden;
    }

    /* Gold Border Accent */
    .container::before {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 4px;
      background: linear-gradient(90deg, var(--gold-dark), var(--gold-bright), var(--gold-dark));
    }

    header {
      text-align: center;
      margin-bottom: 45px;
    }

    /* Shining Font Effect */
    h1 {
      font-family: 'Cinzel', serif;
      font-size: 2.2rem;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 6px;
      background: linear-gradient(to right, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 2px rgba(252, 246, 186, 0.3));
    }

    .subtitle {
      color: var(--text-gold);
      font-size: 0.75rem;
      margin-top: 12px;
      text-transform: uppercase;
      letter-spacing: 4px;
      opacity: 0.8;
      font-weight: 500;
    }

    /* Form Inputs */
    .form-group {
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 10px;
      color: var(--gold-primary);
    }

    input[type="url"],
    input[type="password"],
    input[type="text"],
    textarea {
      width: 100%;
      padding: 15px;
      background: var(--input-bg);
      border: 1px solid #333;
      color: #fff;
      font-size: 0.9rem;
      border-radius: 0; /* Sharp Edges */
      transition: all 0.4s ease;
      outline: none;
    }

    input:focus, textarea:focus {
      border-color: var(--gold-primary);
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
    }

    .split-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    /* Premium Button with Shining Effect */
    button {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #bf953f 0%, #fcf6ba 50%, #aa771c 100%);
      color: #000;
      border: none;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    button:hover {
      filter: brightness(1.1);
      transform: scale(1.01);
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
    }

    /* Advanced Section */
    details {
      margin: 25px 0;
      border: 1px solid #222;
    }

    summary {
      padding: 12px;
      cursor: pointer;
      color: var(--gold-primary);
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      background: #0a0a0a;
    }

    .advanced-content {
      padding: 20px;
      background: #0a0a0a;
    }

    /* Output Styling */
    .output-section {
      margin-top: 40px;
      border-top: 1px solid #222;
      padding-top: 30px;
    }

    #output {
      border: 1px solid var(--gold-dark);
      background: #000;
      color: var(--gold-bright);
      text-align: center;
    }

    #copy {
      background: transparent;
      border: 1px solid var(--gold-primary);
      color: var(--gold-primary);
      margin-top: 15px;
    }

    #copy:hover {
      background: var(--gold-primary);
      color: #000;
    }

    footer {
      text-align: center;
      margin-top: 50px;
      border-top: 1px solid #222;
      padding-top: 20px;
    }

    .copyright {
      color: var(--gold-bright);
      font-weight: 700;
      letter-spacing: 1px;
    }

    /* Professional Scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: #050505; }
    ::-webkit-scrollbar-thumb { background: var(--gold-dark); }
  </style>

  <script type="text/javascript" src="../b64.js"></script>
  <script type="text/javascript" src="../api.js"></script>
  <script type="text/javascript" src="create.js"></script>
</head>

<body onload="main()">

  <div class="container">
    <header>
      <h1>Link Lock</h1>
      <p class="subtitle">Secure Digital Vault — Anas Chawdhary Edition</p>
    </header>

    <div class="form">
      <div class="form-group">
        <label><i class="fa-solid fa-crown"></i> Destination URL</label>
        <input type="url" id="url" placeholder="https://premium-resource.com" required />
      </div>

      <div class="form-group">
        <label><i class="fa-solid fa-comment"></i> Security Hint</label>
        <textarea id="hint" rows="1" placeholder="Optional security clue"></textarea>
      </div>

      <div class="split-row">
        <div class="form-group">
          <label><i class="fa-solid fa-key"></i> Master Key</label>
          <input type="password" id="password" placeholder="••••••••" />
        </div>
        <div class="form-group">
          <label><i class="fa-solid fa-shield-check"></i> Verify</label>
          <input type="password" id="confirm-password" placeholder="••••••••" />
        </div>
      </div>

      <details>
        <summary>Advanced Protocol</summary>
        <div class="advanced-content">
          <div style="display:flex; align-items:center; gap:10px;">
            <input type="checkbox" id="iv" checked />
            <label style="margin:0;">Enable IV Vector</label>
          </div>
          <br>
          <div style="display:flex; align-items:center; gap:10px;">
            <input type="checkbox" id="salt" checked />
            <label style="margin:0;">Apply Random Salt</label>
          </div>
        </div>
      </details>

      <button id="encrypt" onclick="onEncrypt()">
        Seal Securely
      </button>
    </div>

    <div class="output-section">
      <label>Encrypted Output</label>
      <input type="text" id="output" readonly placeholder="Awaiting Encryption..." />
      <button id="copy" onclick="onCopy('output')">
        <i class="fa-solid fa-copy"></i> Copy To Vault
      </button>
    </div>

    <footer>
      <p style="font-size: 0.65rem; color: #555; letter-spacing: 2px; text-transform: uppercase;">
        Developed by <span class="copyright">Anas Chawdhary</span>
      </p>
    </footer>
  </div>

</body>
</html>
