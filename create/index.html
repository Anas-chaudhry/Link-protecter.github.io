<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="author" content="Anas Chawdhary" />
  <meta name="description" content="Elite Tier Link Encryption" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />

  <title>VAULT LOCK | ANAS CHAWDHARY</title>

  <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@700&family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --emerald-dark: #022c22;
      --emerald-glow: #059669;
      --silver-main: #e2e8f0;
      --silver-bright: #ffffff;
      --deep-black: #0a0f0d;
      --glass-bg: rgba(255, 255, 255, 0.03);
    }

    body {
      background-color: var(--deep-black);
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(5, 150, 105, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(5, 150, 105, 0.1) 0%, transparent 40%);
      color: var(--silver-main);
      font-family: 'Outfit', sans-serif;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Premium Glass Container */
    .container {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      width: 100%;
      max-width: 480px;
      padding: 50px 40px;
      border-radius: 30px;
      border: 1px solid rgba(226, 232, 240, 0.1);
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8);
      position: relative;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    /* Silver Metallic Shining Font */
    h1 {
      font-family: 'Syncopate', sans-serif;
      font-size: 1.8rem;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 8px;
      background: linear-gradient(to right, #94a3b8 0%, #ffffff 50%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.2));
    }

    .subtitle {
      color: var(--emerald-glow);
      font-size: 0.7rem;
      margin-top: 15px;
      text-transform: uppercase;
      letter-spacing: 5px;
      font-weight: 800;
    }

    /* Vertical Form Styling */
    .form-group {
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 10px;
      color: rgba(226, 232, 240, 0.6);
    }

    input[type="url"],
    input[type="password"],
    input[type="text"],
    textarea {
      width: 100%;
      padding: 16px 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 1rem;
      border-radius: 15px;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      outline: none;
      box-sizing: border-box;
    }

    input:focus, textarea:focus {
      border-color: var(--emerald-glow);
      background: rgba(5, 150, 105, 0.05);
      box-shadow: 0 0 25px rgba(5, 150, 105, 0.2);
    }

    /* Premium Button with Inner Shine */
    button {
      width: 100%;
      padding: 18px;
      background: linear-gradient(135deg, #059669 0%, #10b981 100%);
      color: #ffffff;
      border: none;
      border-radius: 15px;
      font-family: 'Outfit', sans-serif;
      font-size: 0.9rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 3px;
      cursor: pointer;
      margin-top: 15px;
      transition: all 0.3s ease;
      box-shadow: 0 10px 20px rgba(5, 150, 105, 0.3);
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 30px rgba(5, 150, 105, 0.5);
      filter: brightness(1.1);
    }

    /* Advanced Section Overlay */
    details {
      margin: 25px 0;
      border-radius: 15px;
      overflow: hidden;
      background: rgba(0,0,0,0.2);
    }

    summary {
      padding: 15px;
      cursor: pointer;
      color: var(--silver-main);
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      list-style: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    summary::after {
      content: '\2b45';
      font-size: 10px;
      color: var(--emerald-glow);
    }

    .advanced-content {
      padding: 20px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    /* Output Section */
    .output-section {
      margin-top: 40px;
      padding-top: 30px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    #output {
      border: 1px solid var(--emerald-glow);
      background: rgba(0, 0, 0, 0.4);
      color: var(--emerald-glow);
      letter-spacing: 1px;
    }

    #copy {
      background: transparent;
      border: 1px solid var(--silver-main);
      color: var(--silver-main);
      box-shadow: none;
    }

    #copy:hover {
      background: var(--silver-main);
      color: var(--deep-black);
    }

    footer {
      text-align: center;
      margin-top: 50px;
    }

    .copyright {
      color: var(--silver-bright);
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-size: 0.7rem;
    }

    /* Modern HD Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--deep-black); }
    ::-webkit-scrollbar-thumb { background: var(--emerald-glow); border-radius: 10px; }

  </style>

  <script type="text/javascript" src="../b64.js"></script>
  <script type="text/javascript" src="../api.js"></script>
  <script type="text/javascript" src="create.js"></script>
</head>

<body onload="main()">

  <div class="container">
    <header>
      <h1>VAULT LOCK</h1>
      <p class="subtitle">PREMIUM DIGITAL ENCRYPTION</p>
    </header>

    <div class="form">
      <div class="form-group">
        <label><i class="fa-solid fa-link"></i> Target Destination</label>
        <input type="url" id="url" placeholder="Enter secure URL" required />
      </div>

      <div class="form-group">
        <label><i class="fa-solid fa-feather"></i> Private Hint</label>
        <textarea id="hint" rows="1" placeholder="Optional security memo"></textarea>
      </div>

      <div class="form-group">
        <label><i class="fa-solid fa-fingerprint"></i> Encryption Key</label>
        <input type="password" id="password" placeholder="Create Master Password" />
      </div>

      <div class="form-group">
        <label><i class="fa-solid fa-shield-halved"></i> Key Verification</label>
        <input type="password" id="confirm-password" placeholder="Repeat Master Password" />
      </div>

      <details>
        <summary>System Parameters</summary>
        <div class="advanced-content">
          <div style="display:flex; align-items:center; gap:15px; margin-bottom: 10px;">
            <input type="checkbox" id="iv" checked style="accent-color: var(--emerald-glow); width: 18px; height: 18px;" />
            <label style="margin:0; text-transform: none; letter-spacing: 0;">Activate IV Vector</label>
          </div>
          <div style="display:flex; align-items:center; gap:15px;">
            <input type="checkbox" id="salt" checked style="accent-color: var(--emerald-glow); width: 18px; height: 18px;" />
            <label style="margin:0; text-transform: none; letter-spacing: 0;">Apply Random Salt</label>
          </div>
        </div>
      </details>

      <button id="encrypt" onclick="onEncrypt()">
        INITIATE SEAL
      </button>
    </div>

    <div class="output-section">
      <label>Secured Output</label>
      <input type="text" id="output" readonly placeholder="Waiting for protocols..." />
      <button id="copy" onclick="onCopy('output')">
        <i class="fa-solid fa-copy"></i> Copy To Clipboard
      </button>
    </div>

    <footer>
      <p class="copyright">AUTHOR: ANAS CHAWDHARY</p>
    </footer>
  </div>

</body>
</html>
